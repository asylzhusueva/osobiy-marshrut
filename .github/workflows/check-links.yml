name: Проверка ссылок каталога
on:
  schedule:
    - cron: "0 6 1 * *"   # первого числа каждого месяца в 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить внешние ссылки
        run: |
          grep -o 'https\?://[^" ]*' index.html \
            | grep -v github.io | sort -u > links.txt
          fail=0
          while read -r url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 "$url" || echo "000")
            echo "$code $url"
            if [ "$code" = "000" ] || [ "$code" -ge 400 ]; then fail=1; fi
          done < links.txt
          if [ "$fail" = "1" ]; then
            echo "::error::Часть ссылок недоступна — проверьте список выше"
            exit 1
          fi
